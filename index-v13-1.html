<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color" content="#050507">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CT Scoreboard">

  <title>Chalky Trousers Scoreboard</title>

  <style>
    :root {
      --bg: #050507;
      --panel: #0b0b10;
      --panel-2: #101016;
      --text: #f7f7fb;
      --muted: rgba(247, 247, 251, 0.46);
      --line: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.18);

      --teal: #17e5d1;
      --purple: #8b5cf6;
      --danger: #ff5b67;

      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background: #000;
      color: var(--text);
      overflow: hidden;
      overscroll-behavior: none;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, Helvetica, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    button,
    select {
      font: inherit;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    /*
      One fixed 16:9 canvas.
      It scales down to fit whichever landscape phone is being used.
    */
    .scoreboard {
      position: relative;
      width: min(100vw, calc(100dvh * 16 / 9));
      max-width: 100vw;
      aspect-ratio: 16 / 9;
      max-height: 100dvh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 17% 55%, rgba(23, 229, 209, 0.11), transparent 32%),
        radial-gradient(circle at 83% 55%, rgba(139, 92, 246, 0.12), transparent 34%),
        linear-gradient(180deg, #09090d 0%, #050507 100%);
    }

    .scoreboard::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      opacity: 0.28;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, transparent, black 22%, black 78%, transparent);
    }

    .scoreboard::after {
      content: "";
      position: absolute;
      width: 64%;
      aspect-ratio: 1;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -44%);
      border: 1px solid rgba(255,255,255,0.045);
      border-radius: 50%;
      z-index: -1;
      box-shadow:
        0 0 0 5vw rgba(255,255,255,0.012),
        0 0 0 11vw rgba(255,255,255,0.008);
      pointer-events: none;
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: 11% 19% 1fr 15%;
    }

    /* BRAND BAR */

    .brand-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 2.3%;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 5, 7, 0.82);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 1vw;
    }

    .brand img {
      display: block;
      height: clamp(24px, 4.5vh, 52px);
      width: auto;
      max-width: 24vw;
      object-fit: contain;
    }

    .live-title {
      align-self: center;
      font-size: clamp(10px, 1.15vw, 18px);
      font-weight: 800;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.52);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .top-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 0.7vw;
    }

    .icon-btn {
      min-width: 3.2em;
      height: 2.2em;
      padding: 0 0.8em;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255,255,255,0.055);
      color: rgba(255,255,255,0.76);
      font-size: clamp(10px, 1vw, 16px);
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    .icon-btn:active {
      transform: scale(0.97);
      background: rgba(255,255,255,0.09);
    }

    #fullscreen-btn[hidden] {
      display: none;
    }

    /* PLAYER BAR */

    .players {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      border-bottom: 1px solid var(--line);
      background: rgba(9, 9, 13, 0.88);
    }

    .player-divider {
      background: var(--line);
    }

    .player-head {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.25vw;
      padding: 0 2vw;
      position: relative;
    }

    .player-head.left::before,
    .player-head.right::before {
      content: "";
      position: absolute;
      bottom: 0;
      height: 2px;
      width: 38%;
      opacity: 0.7;
    }

    .player-head.left::before {
      right: 8%;
      background: linear-gradient(90deg, transparent, var(--teal));
    }

    .player-head.right::before {
      left: 8%;
      background: linear-gradient(90deg, var(--purple), transparent);
    }

    .player-name {
      min-width: 0;
      max-width: 74%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      text-align: center;
      font-size: clamp(20px, 3.4vw, 58px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.045em;
      text-transform: uppercase;
      outline: none;
      cursor: text;
      user-select: text;
      -webkit-user-select: text;
      touch-action: manipulation;
    }

    .break-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 0.55em;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 0.52em 0.85em;
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.42);
      font-size: clamp(8px, 0.9vw, 14px);
      line-height: 1;
      letter-spacing: 0.13em;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
      touch-action: manipulation;
    }

    .break-dot {
      width: 0.62em;
      height: 0.62em;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 transparent;
    }

    .left .break-btn.active {
      color: var(--teal);
      border-color: rgba(23, 229, 209, 0.45);
      background: rgba(23, 229, 209, 0.08);
    }

    .left .break-btn.active .break-dot {
      box-shadow: 0 0 1.1em rgba(23, 229, 209, 0.95);
    }

    .right .break-btn.active {
      color: #b99cff;
      border-color: rgba(139, 92, 246, 0.52);
      background: rgba(139, 92, 246, 0.10);
    }

    .right .break-btn.active .break-dot {
      box-shadow: 0 0 1.1em rgba(139, 92, 246, 0.95);
    }

    /* SCORE AREA */

    .scores {
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      position: relative;
    }

    .score-divider {
      background:
        linear-gradient(
          to bottom,
          transparent 5%,
          rgba(255,255,255,0.08) 23%,
          rgba(255,255,255,0.15) 50%,
          rgba(255,255,255,0.08) 77%,
          transparent 95%
        );
    }

    .score-side {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      border: 0;
      background: transparent;
      color: white;
      padding: 0;
      cursor: pointer;
      touch-action: none;
      overflow: hidden;
    }

    .score-side::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 120ms ease;
      pointer-events: none;
    }

    .score-side.left::before {
      background: radial-gradient(circle at center, rgba(23,229,209,0.13), transparent 58%);
    }

    .score-side.right::before {
      background: radial-gradient(circle at center, rgba(139,92,246,0.14), transparent 58%);
    }

    .score-side.pressed::before {
      opacity: 1;
    }

    .score {
      position: relative;
      z-index: 1;
      transform: translateY(-1.5%);
      font-size: clamp(92px, 25vw, 400px);
      line-height: 0.76;
      font-weight: 900;
      letter-spacing: -0.095em;
      font-variant-numeric: tabular-nums lining-nums;
      text-align: center;
      text-shadow: 0 0 0 transparent;
      pointer-events: none;
    }

    .score-side.left .score {
      text-shadow: 0 0 5vw rgba(23,229,209,0.07);
    }

    .score-side.right .score {
      text-shadow: 0 0 5vw rgba(139,92,246,0.08);
    }

    .score-side.changed .score {
      animation: score-pop 160ms ease-out;
    }

    @keyframes score-pop {
      0% { transform: translateY(-1.5%) scale(1); }
      48% { transform: translateY(-1.5%) scale(1.055); }
      100% { transform: translateY(-1.5%) scale(1); }
    }

    .tap-hint {
      position: absolute;
      bottom: 7%;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(7px, 0.7vw, 11px);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.16);
      white-space: nowrap;
      pointer-events: none;
    }

    /* MATCH BAR */

    .match-bar {
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2.3%;
      border-top: 1px solid var(--line);
      background: rgba(8,8,11,0.93);
    }

    .bottom-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3.2vw;
    }

    .match-meta {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 0.9vw;
    }

    .meta-label {
      font-size: clamp(7px, 0.7vw, 11px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.16em;
      color: rgba(255,255,255,0.28);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .select-wrap {
      position: relative;
    }

    .match-select {
      height: 2.45em;
      min-width: 5.2em;
      padding: 0 2.2em 0 0.9em;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #111118;
      color: white;
      outline: none;
      font-size: clamp(9px, 0.9vw, 14px);
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    .rules-select {
      min-width: 10.5em;
    }

    .reset-btn,
    .undo-btn {
      height: 2.45em;
      border-radius: 9px;
      padding: 0 1em;
      font-size: clamp(9px, 0.9vw, 14px);
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }

    .reset-btn {
      color: #ff9098;
      border: 1px solid rgba(255,91,103,0.34);
      background: rgba(255,91,103,0.08);
    }

    .undo-btn {
      color: white;
      border: 1px solid rgba(255,255,255,0.17);
      background: rgba(255,255,255,0.07);
    }

    .top-reset-btn {
      height: 2.2em;
      padding: 0 0.9em;
      font-size: clamp(10px, 1vw, 16px);
    }

    .undo-floating {
      position: absolute;
      right: 2.3%;
      top: 50%;
      transform: translateY(-50%);
    }

    .undo-btn[hidden] {
      visibility: hidden;
      pointer-events: none;
    }

    /* ROTATE MESSAGE */

    .rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      padding: 28px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(139,92,246,0.13), transparent 36%),
        radial-gradient(circle at 50% 70%, rgba(23,229,209,0.10), transparent 34%),
        #050507;
    }

    .rotate-icon {
      font-size: 52px;
      line-height: 1;
      transform: rotate(90deg);
    }

    .rotate strong {
      font-size: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .rotate span {
      max-width: 320px;
      color: rgba(255,255,255,0.52);
      font-size: 14px;
    }

    @media (orientation: portrait) {
      .stage {
        display: none;
      }

      .rotate {
        display: flex;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="rotate" aria-live="polite">
    <div class="rotate-icon">↻</div>
    <strong>Rotate to landscape</strong>
    <span>The Chalky Trousers scoreboard is designed to fill a widescreen display.</span>
  </div>

  <div class="stage">
    <main class="scoreboard" aria-label="Chalky Trousers live pool scoreboard">
      <div class="app">

        <header class="brand-bar">
          <div class="brand">
            <img src="assets/chalky.png" alt="Chalky Trousers">
          </div>

          <div class="live-title">Live Scoreboard</div>

          <div class="top-actions">
            <button id="fullscreen-btn" class="icon-btn" type="button" hidden>
              Fullscreen
            </button>
            <button id="resetBtn" class="reset-btn top-reset-btn" type="button">
              Reset
            </button>
          </div>
        </header>

        <section class="players">
          <div class="player-head left">
            <div
              id="player1"
              class="player-name"
              contenteditable="true"
              spellcheck="false"
              role="textbox"
              aria-label="Player one name"
            >PLAYER 1</div>

            <button
              id="break1"
              class="break-btn active"
              type="button"
              aria-label="Set player one to break"
            >
              <span class="break-dot"></span>
              Break
            </button>
          </div>

          <div class="player-divider"></div>

          <div class="player-head right">
            <button
              id="break2"
              class="break-btn"
              type="button"
              aria-label="Set player two to break"
            >
              <span class="break-dot"></span>
              Break
            </button>

            <div
              id="player2"
              class="player-name"
              contenteditable="true"
              spellcheck="false"
              role="textbox"
              aria-label="Player two name"
            >PLAYER 2</div>
          </div>
        </section>

        <section class="scores">
          <button
            id="scoreSide1"
            class="score-side left"
            type="button"
            aria-label="Player one score. Tap to add one. Hold to subtract one."
          >
            <span id="score1" class="score">0</span>
          </button>

          <div class="score-divider"></div>

          <button
            id="scoreSide2"
            class="score-side right"
            type="button"
            aria-label="Player two score. Tap to add one. Hold to subtract one."
          >
            <span id="score2" class="score">0</span>
          </button>
        </section>

        <footer class="match-bar">
          <div class="bottom-controls">
            <div class="match-meta">
              <span class="meta-label">Race to</span>
              <select id="raceTo" class="match-select" aria-label="Race to"></select>
            </div>

            <div class="match-meta">
              <span class="meta-label">Rules</span>
              <select id="rules" class="match-select rules-select" aria-label="Rules">
                <option value="international">International</option>
                <option value="blackball">Blackball</option>
                <option value="wpa">WPA 8-Ball</option>
                <option value="custom">Custom</option>
              </select>
            </div>
          </div>

          <button id="undoBtn" class="undo-btn undo-floating" type="button" hidden>
            Undo reset
          </button>
        </footer>

      </div>
    </main>
  </div>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "ct_scoreboard_v13";

      const state = {
        player1: "PLAYER 1",
        player2: "PLAYER 2",
        score1: 0,
        score2: 0,
        breakSide: 1,
        raceTo: "-",
        rules: "international"
      };

      let resetSnapshot = null;
      let undoTimer = null;
      let wakeLock = null;

      const els = {
        player1: document.getElementById("player1"),
        player2: document.getElementById("player2"),
        score1: document.getElementById("score1"),
        score2: document.getElementById("score2"),
        scoreSide1: document.getElementById("scoreSide1"),
        scoreSide2: document.getElementById("scoreSide2"),
        break1: document.getElementById("break1"),
        break2: document.getElementById("break2"),
        raceTo: document.getElementById("raceTo"),
        rules: document.getElementById("rules"),
        resetBtn: document.getElementById("resetBtn"),
        undoBtn: document.getElementById("undoBtn"),
        fullscreenBtn: document.getElementById("fullscreen-btn")
      };

      function clampScore(value) {
        const parsed = Number.parseInt(value, 10);
        if (!Number.isFinite(parsed)) return 0;
        return Math.max(0, Math.min(parsed, 99));
      }

      function cleanName(value, fallback) {
        const cleaned = String(value ?? "")
          .replace(/\s+/g, " ")
          .trim()
          .slice(0, 20);

        return cleaned || fallback;
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          console.warn("Scoreboard could not be saved.", error);
        }
      }

      function load() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;

          const saved = JSON.parse(raw);

          state.player1 = cleanName(saved.player1, "PLAYER 1");
          state.player2 = cleanName(saved.player2, "PLAYER 2");
          state.score1 = clampScore(saved.score1);
          state.score2 = clampScore(saved.score2);
          state.breakSide = saved.breakSide === 2 ? 2 : 1;
          state.raceTo = saved.raceTo ?? "-";
          state.rules = ["international", "blackball", "wpa", "custom"].includes(saved.rules)
            ? saved.rules
            : "international";
        } catch (error) {
          console.warn("Saved scoreboard data was invalid and has been ignored.", error);
        }
      }

      function render() {
        els.player1.textContent = state.player1;
        els.player2.textContent = state.player2;

        els.score1.textContent = state.score1;
        els.score2.textContent = state.score2;

        els.break1.classList.toggle("active", state.breakSide === 1);
        els.break2.classList.toggle("active", state.breakSide === 2);

        els.raceTo.value = String(state.raceTo);
        els.rules.value = state.rules;
      }

      function setBreak(side) {
        state.breakSide = side === 2 ? 2 : 1;
        renderBreak();
        save();
      }

      function renderBreak() {
        els.break1.classList.toggle("active", state.breakSide === 1);
        els.break2.classList.toggle("active", state.breakSide === 2);
      }

      function animateScore(side) {
        const target = side === 1 ? els.scoreSide1 : els.scoreSide2;
        target.classList.remove("changed");
        void target.offsetWidth;
        target.classList.add("changed");

        window.setTimeout(() => {
          target.classList.remove("changed");
        }, 190);
      }

      function changeScore(side, amount) {
        const key = side === 1 ? "score1" : "score2";
        const before = state[key];
        state[key] = clampScore(before + amount);

        if (state[key] === before) return;

        if (amount > 0) {
          state.breakSide = state.breakSide === 1 ? 2 : 1;
        }

        els[key].textContent = state[key];
        renderBreak();
        animateScore(side);
        save();
      }

      function bindScorePress(element, side) {
        let holdTimer = null;
        let held = false;
        let activePointer = null;

        const clearPress = () => {
          clearTimeout(holdTimer);
          holdTimer = null;
          element.classList.remove("pressed");
        };

        element.addEventListener("pointerdown", async (event) => {
          if (activePointer !== null) return;

          activePointer = event.pointerId;
          held = false;
          element.classList.add("pressed");

          try {
            element.setPointerCapture(event.pointerId);
          } catch (_) {}

          requestWakeLock();

          holdTimer = window.setTimeout(() => {
            held = true;
            changeScore(side, -1);
            if ("vibrate" in navigator) {
              navigator.vibrate?.(35);
            }
          }, 650);
        });

        element.addEventListener("pointerup", (event) => {
          if (event.pointerId !== activePointer) return;

          clearPress();

          if (!held) {
            changeScore(side, 1);
          }

          activePointer = null;
        });

        element.addEventListener("pointercancel", (event) => {
          if (event.pointerId !== activePointer) return;
          clearPress();
          activePointer = null;
        });

        element.addEventListener("contextmenu", (event) => {
          event.preventDefault();
        });
      }

      function bindEditableName(element, key, fallback) {
        element.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            event.preventDefault();
            element.blur();
          }
        });

        element.addEventListener("paste", (event) => {
          event.preventDefault();
          const text = event.clipboardData?.getData("text/plain") || "";
          const clean = cleanName(text, fallback);

          const selection = window.getSelection();
          if (!selection || selection.rangeCount === 0) {
            element.textContent = clean;
            return;
          }

          selection.deleteFromDocument();
          selection.getRangeAt(0).insertNode(document.createTextNode(clean));
          selection.collapseToEnd();
        });

        element.addEventListener("blur", () => {
          state[key] = cleanName(element.textContent, fallback);
          element.textContent = state[key];
          save();
        });
      }

      function createRaceOptions() {
        const blank = document.createElement("option");
        blank.value = "-";
        blank.textContent = "-";
        els.raceTo.appendChild(blank);

        for (let i = 1; i <= 21; i += 1) {
          const option = document.createElement("option");
          option.value = String(i);
          option.textContent = String(i);
          els.raceTo.appendChild(option);
        }
      }

      function resetScores() {
        resetSnapshot = {
          score1: state.score1,
          score2: state.score2,
          breakSide: state.breakSide
        };

        state.score1 = 0;
        state.score2 = 0;

        render();
        save();

        els.undoBtn.hidden = false;
        window.clearTimeout(undoTimer);

        undoTimer = window.setTimeout(() => {
          resetSnapshot = null;
          els.undoBtn.hidden = true;
        }, 5000);
      }

      function undoReset() {
        if (!resetSnapshot) return;

        state.score1 = resetSnapshot.score1;
        state.score2 = resetSnapshot.score2;
        state.breakSide = resetSnapshot.breakSide;

        resetSnapshot = null;
        els.undoBtn.hidden = true;
        window.clearTimeout(undoTimer);

        render();
        save();
      }

      async function requestWakeLock() {
        if (!("wakeLock" in navigator)) return;
        if (document.visibilityState !== "visible") return;

        try {
          if (wakeLock) return;
          wakeLock = await navigator.wakeLock.request("screen");

          wakeLock.addEventListener("release", () => {
            wakeLock = null;
          });
        } catch (_) {
          wakeLock = null;
        }
      }

      function configureFullscreen() {
        const supported =
          document.fullscreenEnabled &&
          typeof document.documentElement.requestFullscreen === "function";

        els.fullscreenBtn.hidden = !supported;

        if (!supported) return;

        els.fullscreenBtn.addEventListener("click", async () => {
          try {
            if (!document.fullscreenElement) {
              await document.documentElement.requestFullscreen();
            } else {
              await document.exitFullscreen();
            }
          } catch (error) {
            console.warn("Fullscreen request was not completed.", error);
          }
        });

        document.addEventListener("fullscreenchange", () => {
          els.fullscreenBtn.textContent = document.fullscreenElement
            ? "Exit fullscreen"
            : "Fullscreen";
        });
      }

      function bindEvents() {
        bindScorePress(els.scoreSide1, 1);
        bindScorePress(els.scoreSide2, 2);

        bindEditableName(els.player1, "player1", "PLAYER 1");
        bindEditableName(els.player2, "player2", "PLAYER 2");

        els.break1.addEventListener("click", () => setBreak(1));
        els.break2.addEventListener("click", () => setBreak(2));

        els.raceTo.addEventListener("change", () => {
          state.raceTo = els.raceTo.value;
          save();
        });

        els.rules.addEventListener("change", () => {
          state.rules = els.rules.value;
          save();
        });

        els.resetBtn.addEventListener("click", resetScores);
        els.undoBtn.addEventListener("click", undoReset);

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            requestWakeLock();
          }
        });

        document.addEventListener(
          "pointerdown",
          () => requestWakeLock(),
          { once: true, passive: true }
        );
      }

      createRaceOptions();
      load();
      render();
      configureFullscreen();
      bindEvents();
    })();
  </script>
</body>
</html>
